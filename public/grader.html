<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grader — The Money Machine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%2334d399'/><stop offset='0.5' stop-color='%2310b981'/><stop offset='1' stop-color='%23059669'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='%23060609'/><path d='M50 16v68' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/><path d='M62 30c0-8-7-12-14-12s-14 4-14 11c0 14 28 8 28 24c0 8-7 13-14 13s-14-5-14-13' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --pass: #34d399;
      --fail: #f87171;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: rgba(255, 255, 255, 0.92);
      --text-dim: rgba(255, 255, 255, 0.4);
      --text-mid: rgba(255, 255, 255, 0.6);
      --font: 'Satoshi', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --focus-ring: 0 0 0 2px #050508, 0 0 0 4px rgba(255, 255, 255, 0.5);
    }
    body {
      background: #050508;
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .login-gate {
      position: fixed; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      background: rgba(5, 5, 8, 0.97);
    }
    .login-gate.hidden { display: none; }
    .login-card {
      width: 380px; max-width: calc(100vw - 48px);
      padding: 48px 40px; border-radius: 20px; text-align: center;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
    }
    .login-title { font-size: 24px; font-weight: 900; letter-spacing: -1px; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
    .login-input, .fund-input {
      width: 100%; padding: 14px 18px; border-radius: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text); font-family: var(--font); font-size: 14px;
    }
    .login-input { font-family: var(--mono); text-align: center; margin-bottom: 16px; }
    .login-input:focus, .fund-input:focus { outline: none; border-color: rgba(255,255,255,0.35); }
    .login-btn, .grade-btn, .ghost-btn {
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text); font-family: var(--font); font-weight: 700;
      cursor: pointer; transition: background 0.2s, transform 0.15s;
    }
    .login-btn, .grade-btn {
      background: rgba(255,255,255,0.1);
    }
    .login-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 14px; }
    .login-btn:hover, .grade-btn:hover { background: rgba(255,255,255,0.16); }
    .login-btn:focus-visible, .grade-btn:focus-visible, .ghost-btn:focus-visible, .back-link:focus-visible {
      outline: none; box-shadow: var(--focus-ring);
    }
    button:disabled { opacity: 0.45; cursor: default; }

    .wrap { max-width: 920px; margin: 0 auto; padding: 36px 20px 80px; }
    .header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .header h1 { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
    .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); }
    .back-link { color: var(--text-dim); font-size: 13px; text-decoration: none; }
    .back-link:hover { color: var(--text); }

    .upload-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
    }
    .drop {
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 16px;
      min-height: 220px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop:hover, .drop.drag { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.03); }
    .drop img { max-width: 100%; max-height: 280px; border-radius: 8px; display: block; }
    .drop-copy { color: var(--text-mid); font-size: 15px; line-height: 1.5; }
    .drop-copy strong { color: var(--text); font-weight: 700; }
    .hint { margin-top: 6px; color: var(--text-dim); font-size: 12px; font-family: var(--mono); }
    .row { display: flex; gap: 12px; margin-top: 16px; align-items: center; }
    .fund-input { flex: 1; }
    .grade-btn { padding: 14px 22px; border-radius: 12px; font-size: 14px; white-space: nowrap; }
    .error {
      margin-top: 14px; padding: 12px 14px; border-radius: 12px;
      background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fecaca; font-size: 13px;
    }
    .hidden { display: none !important; }

    .certificate {
      margin-top: 28px;
      padding: 28px;
      border-radius: 4px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: inset 0 0 0 6px #050508, inset 0 0 0 7px rgba(255,255,255,0.12);
      animation: rise 0.45s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    .cert-top {
      display: grid;
      grid-template-columns: 180px 1fr auto;
      gap: 28px;
      align-items: center;
    }
    .thumb {
      width: 180px; height: 180px; object-fit: cover;
      border-radius: 2px; border: 1px solid rgba(255,255,255,0.12);
      background: #0a0a0d;
    }
    .cert-meta .kicker { margin-bottom: 10px; }
    .score {
      font-size: 84px; font-weight: 900; letter-spacing: -4px; line-height: 0.85;
    }
    .score span { font-size: 22px; letter-spacing: 0; color: var(--text-dim); font-weight: 500; margin-left: 4px; }
    .tier {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .summary { margin-top: 14px; max-width: 420px; color: var(--text-mid); font-size: 15px; line-height: 1.45; }
    .category {
      display: inline-block; margin-top: 14px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
      color: var(--text-dim); border: 1px solid rgba(255,255,255,0.12);
      padding: 4px 8px; border-radius: 999px;
    }
    .seal {
      width: 112px; height: 112px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; letter-spacing: 0.14em; font-size: 15px;
      border: 2px solid currentColor;
      box-shadow: inset 0 0 0 5px transparent, inset 0 0 0 6px currentColor;
      transform: rotate(-12deg);
      animation: stamp 0.35s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .seal.pass { color: var(--pass); }
    .seal.fail { color: var(--fail); }
    @keyframes stamp {
      from { opacity: 0; transform: rotate(-12deg) scale(1.4); }
      to { opacity: 1; transform: rotate(-12deg) scale(1); }
    }

    .reasons { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .reason h2 {
      font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-dim); font-weight: 700; margin-bottom: 10px;
    }
    .reason li { list-style: none; font-size: 14px; line-height: 1.4; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.08); }
    .flags { margin-top: 18px; }
    .flag {
      font-size: 13px; color: #fecaca;
      padding: 8px 0; border-top: 1px solid rgba(248,113,113,0.25);
    }
    .bars { margin-top: 22px; display: grid; gap: 8px; }
    .bar-row { display: grid; grid-template-columns: 110px 1fr 36px; gap: 10px; align-items: center; font-size: 12px; color: var(--text-mid); }
    .bar-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; background: rgba(255,255,255,0.7); }
    .bar-row span:last-child { font-family: var(--mono); text-align: right; }
    .again { margin-top: 22px; }
    .ghost-btn { background: transparent; padding: 10px 14px; border-radius: 10px; font-size: 13px; }

    @media (max-width: 720px) {
      .cert-top { grid-template-columns: 1fr; justify-items: start; }
      .thumb { width: 100%; height: 220px; }
      .score { font-size: 72px; }
      .reasons { grid-template-columns: 1fr; }
      .row { flex-direction: column; align-items: stretch; }
    }
    @media (prefers-reduced-motion: reduce) {
      .certificate, .seal { animation: none; }
    }
  </style>
</head>
<body>
  <div id="login-gate" class="login-gate">
    <div class="login-card">
      <div class="login-title">The Money Machine</div>
      <div class="login-sub">Enter password to grade an image</div>
      <input id="login-password" type="password" class="login-input" placeholder="Password" autocomplete="off" />
      <button id="login-btn" class="login-btn">Enter</button>
    </div>
  </div>

  <div class="wrap" id="main" style="display:none">
    <header class="header">
      <div>
        <div class="kicker">Official Clog grade</div>
        <h1>Image Grader</h1>
      </div>
      <a class="back-link" href="/">← Generate</a>
    </header>

    <section class="upload-panel" id="upload-panel">
      <label class="drop" id="drop" for="file">
        <div class="drop-copy" id="drop-copy">
          <strong>Upload a fund image</strong>
          <div class="hint">JPEG, PNG, WEBP, or GIF · 20MB max</div>
        </div>
      </label>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="hidden" />
      <div class="row">
        <input id="fund-name" class="fund-input" type="text" maxlength="200" placeholder="Fund name (optional)" autocomplete="off" />
        <button id="grade-btn" class="grade-btn" disabled>Grade</button>
      </div>
      <div id="error" class="error hidden" role="alert"></div>
    </section>

    <section id="result" class="hidden" aria-live="polite"></section>
  </div>

  <script>
    const loginGate = document.getElementById('login-gate');
    const loginPassword = document.getElementById('login-password');
    const loginBtn = document.getElementById('login-btn');
    const mainEl = document.getElementById('main');
    const fileInput = document.getElementById('file');
    const drop = document.getElementById('drop');
    const dropCopy = document.getElementById('drop-copy');
    const gradeBtn = document.getElementById('grade-btn');
    const fundName = document.getElementById('fund-name');
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');

    let selectedFile = null;
    let previewUrl = null;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove('hidden');
    }
    function clearError() {
      errorEl.classList.add('hidden');
      errorEl.textContent = '';
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/check');
        const data = await res.json();
        if (data.authed) unlock();
      } catch {}
    }

    function unlock() {
      loginGate.classList.add('hidden');
      mainEl.style.display = '';
    }

    async function doLogin() {
      const password = loginPassword.value;
      if (!password) return;
      loginBtn.disabled = true;
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) unlock();
        else loginPassword.style.borderColor = '#f87171';
      } catch {
        loginPassword.style.borderColor = '#f87171';
      } finally {
        loginBtn.disabled = false;
      }
    }

    function setFile(file) {
      if (!file) return;
      const ok = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(file.type);
      if (!ok) { showError('Use a JPEG, PNG, WEBP, or GIF.'); return; }
      if (file.size > 20 * 1024 * 1024) { showError('Image must be under 20MB.'); return; }
      clearError();
      selectedFile = file;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      dropCopy.innerHTML = `<img src="${previewUrl}" alt="Selected image preview" />`;
      gradeBtn.disabled = false;
      resultEl.classList.add('hidden');
      resultEl.innerHTML = '';
    }

    function list(items) {
      if (!items?.length) return '<li>None noted.</li>';
      return items.map((item) => `<li>${esc(item)}</li>`).join('');
    }

    function renderGrade(grade) {
      const pass = grade.verdict === 'PASS';
      const bars = (grade.elementScores || []).map((el) => `
        <div class="bar-row">
          <span>${esc(el.name)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0, Math.min(100, el.score * 10))}%"></div></div>
          <span>${esc(el.score.toFixed(1))}</span>
        </div>
      `).join('');
      const flags = (grade.redFlags || []).map((flag) => `<div class="flag">${esc(flag)}</div>`).join('');

      resultEl.className = 'certificate';
      resultEl.innerHTML = `
        <div class="cert-top">
          <img class="thumb" src="${previewUrl}" alt="" />
          <div class="cert-meta">
            <div class="kicker">Clog certificate</div>
            <div class="score">${esc(Number(grade.score).toFixed(1))}<span>/10</span></div>
            <div class="tier" style="color:${pass ? 'var(--pass)' : 'var(--fail)'}">${esc(grade.tier)}</div>
            <p class="summary">${esc(grade.summary)}</p>
            <div class="category">${esc(grade.category)}</div>
          </div>
          <div class="seal ${pass ? 'pass' : 'fail'}" aria-label="${pass ? 'Pass' : 'Fail'}">${esc(grade.verdict)}</div>
        </div>
        <div class="reasons">
          <div class="reason">
            <h2>Why it works</h2>
            <ul>${list(grade.strengths)}</ul>
          </div>
          <div class="reason">
            <h2>What holds it back</h2>
            <ul>${list(grade.weaknesses)}</ul>
          </div>
        </div>
        ${flags ? `<div class="flags"><h2 class="kicker" style="margin-bottom:8px">Red flags</h2>${flags}</div>` : ''}
        ${bars ? `<div class="bars">${bars}</div>` : ''}
        ${(grade.capsApplied || []).length ? `<p class="hint" style="margin-top:14px">Caps applied: ${esc(grade.capsApplied.join(' · '))}</p>` : ''}
        <div class="again"><button class="ghost-btn" id="again-btn" type="button">Grade another</button></div>
      `;
      document.getElementById('again-btn').addEventListener('click', reset);
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function reset() {
      selectedFile = null;
      fileInput.value = '';
      gradeBtn.disabled = true;
      dropCopy.innerHTML = `<strong>Upload a fund image</strong><div class="hint">JPEG, PNG, WEBP, or GIF · 20MB max</div>`;
      resultEl.className = 'hidden';
      resultEl.innerHTML = '';
      if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    }

    async function grade() {
      if (!selectedFile) return;
      clearError();
      gradeBtn.disabled = true;
      gradeBtn.textContent = 'Evaluating…';
      const body = new FormData();
      body.append('image', selectedFile);
      if (fundName.value.trim()) body.append('fundName', fundName.value.trim());
      try {
        const res = await fetch('/api/grade', { method: 'POST', body });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { location.reload(); return; }
        if (!res.ok) throw new Error(data.error || `Server returned ${res.status}`);
        renderGrade(data);
      } catch (err) {
        showError(err.message || 'Grading failed');
      } finally {
        gradeBtn.disabled = !selectedFile;
        gradeBtn.textContent = 'Grade';
      }
    }

    fileInput.addEventListener('change', () => setFile(fileInput.files?.[0]));
    ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => {
      e.preventDefault();
      drop.classList.add('drag');
    }));
    ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => {
      e.preventDefault();
      drop.classList.remove('drag');
    }));
    drop.addEventListener('drop', (e) => setFile(e.dataTransfer?.files?.[0]));
    gradeBtn.addEventListener('click', grade);
    loginBtn.addEventListener('click', doLogin);
    loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    checkAuth();
  </script>
</body>
</html>
