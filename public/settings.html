<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — The Money Machine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%2334d399'/><stop offset='0.5' stop-color='%2310b981'/><stop offset='1' stop-color='%23059669'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='%23060609'/><path d='M50 16v68' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/><path d='M62 30c0-8-7-12-14-12s-14 4-14 11c0 14 28 8 28 24c0 8-7 13-14 13s-14-5-14-13' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --pass: #34d399;
      --fail: #f87171;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: rgba(255, 255, 255, 0.92);
      --text-dim: rgba(255, 255, 255, 0.4);
      --text-mid: rgba(255, 255, 255, 0.6);
      --font: 'Satoshi', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: #050508;
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .login-gate {
      position: fixed; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      background: rgba(5, 5, 8, 0.97);
    }
    .login-gate.hidden { display: none; }
    .login-card {
      width: 380px; max-width: calc(100vw - 48px);
      padding: 48px 40px; border-radius: 24px; text-align: center;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(40px);
    }
    .login-title { font-size: 24px; font-weight: 900; letter-spacing: -1px; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 28px; }
    .login-input {
      width: 100%; padding: 14px 18px; border-radius: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text); font-family: var(--mono); font-size: 14px;
      text-align: center; margin-bottom: 16px;
    }
    .login-input::placeholder { color: rgba(255,255,255,0.2); }
    .login-input:focus { outline: none; border-color: rgba(255,255,255,0.2); }
    .login-btn {
      width: 100%; padding: 14px; border-radius: 12px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      color: var(--text); font-family: var(--font); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    .login-btn:hover { background: rgba(255,255,255,0.14); }

    .container {
      max-width: 960px; margin: 0 auto; padding: 40px 24px 80px;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 40px;
    }
    .header h1 { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
    .back-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-mid); font-family: var(--font); font-size: 12px;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      text-decoration: none; transition: color 0.2s, border-color 0.2s;
    }
    .back-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    .section {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 24px; margin-bottom: 24px;
    }
    .section-title {
      font-size: 16px; font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-count {
      font-size: 11px; color: var(--text-dim); font-family: var(--mono);
      background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 4px;
    }

    .add-row {
      display: flex; gap: 8px; margin-bottom: 16px; align-items: center;
    }
    .add-input {
      flex: 1; padding: 10px 14px; border-radius: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); font-family: var(--font); font-size: 13px;
    }
    .add-input::placeholder { color: rgba(255,255,255,0.2); }
    .add-input:focus { outline: none; border-color: rgba(255,255,255,0.25); }
    .add-input.mono { font-family: var(--mono); font-size: 12px; }
    .add-btn {
      padding: 10px 20px; border-radius: 8px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      color: var(--text); font-family: var(--font); font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: background 0.2s;
    }
    .add-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .add-btn:not(:disabled):hover { background: rgba(255,255,255,0.14); }

    .file-label {
      display: inline-flex; align-items: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 10px 14px;
      color: var(--text-mid); font-size: 12px; cursor: pointer; white-space: nowrap;
      transition: border-color 0.2s, color 0.2s;
    }
    .file-label:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    .status-msg {
      font-size: 12px; padding: 6px 0; font-family: var(--mono);
    }
    .status-msg.hidden { display: none; }
    .status-msg.ok { color: var(--pass); }
    .status-msg.err { color: var(--fail); }

    .item-list { display: flex; flex-direction: column; gap: 6px; }
    .item-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: 10px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
      transition: border-color 0.2s;
    }
    .item-row:hover { border-color: rgba(255,255,255,0.12); }
    .item-label { font-size: 13px; font-weight: 500; flex: 1; }
    .item-tag { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
    .item-delete {
      background: none; border: none; cursor: pointer;
      color: var(--fail); font-size: 16px; padding: 2px 6px;
      opacity: 0.3; transition: opacity 0.2s;
    }
    .item-delete:hover { opacity: 1; }

    .sref-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
    }
    .sref-card {
      border-radius: 12px; overflow: hidden;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      transition: border-color 0.2s;
    }
    .sref-card:hover { border-color: rgba(255,255,255,0.15); }
    .sref-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .sref-card-info { padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; }
    .sref-card-name { font-size: 11px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .sref-card-delete {
      background: none; border: none; cursor: pointer;
      color: var(--fail); font-size: 14px; padding: 2px 6px;
      opacity: 0.3; transition: opacity 0.2s;
    }
    .sref-card-delete:hover { opacity: 1; }
    .empty-msg { color: var(--text-dim); font-size: 13px; padding: 30px 0; text-align: center; }
  </style>
</head>
<body>
  <div id="login-gate" class="login-gate">
    <div class="login-card">
      <div class="login-title">Settings</div>
      <div class="login-sub">Enter settings password to continue</div>
      <input id="login-password" type="password" class="login-input" placeholder="Password" autocomplete="off" />
      <button id="login-btn" class="login-btn">Enter</button>
    </div>
  </div>

  <div id="main" class="container" style="display:none">
    <div class="header">
      <h1>Settings</h1>
      <a href="/" class="back-btn">&larr; Back to App</a>
    </div>

    <!-- Profile Bank -->
    <div class="section">
      <div class="section-title">
        Profile Tags
        <span id="profile-count" class="section-count">0</span>
      </div>
      <div class="add-row">
        <input id="profile-label" class="add-input" type="text" placeholder="Label (e.g. Carter)" maxlength="50" autocomplete="off" />
        <input id="profile-tag" class="add-input mono" type="text" placeholder="--profile abc123" maxlength="80" autocomplete="off" />
        <button id="profile-add-btn" class="add-btn" disabled>Add</button>
      </div>
      <div id="profile-status" class="status-msg hidden"></div>
      <div id="profile-list" class="item-list"></div>
    </div>

    <!-- Style References -->
    <div class="section">
      <div class="section-title">
        Style References
        <span id="sref-count" class="section-count">0</span>
      </div>
      <div class="add-row">
        <input id="sref-name" class="add-input" type="text" placeholder="Reference name..." maxlength="100" autocomplete="off" />
        <label class="file-label" id="sref-file-label">
          <span id="sref-file-text">Choose image...</span>
          <input id="sref-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none" />
        </label>
        <button id="sref-add-btn" class="add-btn" disabled>Upload</button>
      </div>
      <div id="sref-status" class="status-msg hidden"></div>
      <div id="sref-grid" class="sref-grid"></div>
    </div>
  </div>

  <script>
    const loginGate = document.getElementById('login-gate');
    const loginPassword = document.getElementById('login-password');
    const loginBtn = document.getElementById('login-btn');
    const mainEl = document.getElementById('main');

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    async function checkAuth() {
      try {
        const res = await fetch('/api/settings/auth/check');
        const data = await res.json();
        if (data.authed) unlock();
      } catch {}
    }

    function unlock() {
      loginGate.classList.add('hidden');
      mainEl.style.display = '';
      loadProfiles();
      loadSrefs();
    }

    async function doLogin() {
      const pw = loginPassword.value.trim();
      if (!pw) return;
      try {
        const res = await fetch('/api/settings/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        if (res.ok) unlock();
        else loginPassword.style.borderColor = '#f87171';
      } catch {}
    }

    loginBtn.addEventListener('click', doLogin);
    loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    checkAuth();

    // --- Profiles ---
    const profileLabel = document.getElementById('profile-label');
    const profileTag = document.getElementById('profile-tag');
    const profileAddBtn = document.getElementById('profile-add-btn');
    const profileCount = document.getElementById('profile-count');
    const profileList = document.getElementById('profile-list');
    const profileStatus = document.getElementById('profile-status');

    function updateProfileBtn() {
      profileAddBtn.disabled = !profileLabel.value.trim() || !profileTag.value.trim().startsWith('--profile');
    }
    profileLabel.addEventListener('input', updateProfileBtn);
    profileTag.addEventListener('input', updateProfileBtn);

    function showStatus(el, msg, isError) {
      el.textContent = msg;
      el.className = 'status-msg ' + (isError ? 'err' : 'ok');
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    async function loadProfiles() {
      try {
        const res = await fetch('/api/settings/profiles');
        if (res.status === 401) { location.reload(); return; }
        const profiles = await res.json();
        profileCount.textContent = profiles.length;
        if (profiles.length === 0) {
          profileList.innerHTML = '<div class="empty-msg">No profiles added yet.</div>';
          return;
        }
        profileList.innerHTML = profiles.map((p, i) => `
          <div class="item-row">
            <span class="item-label">${esc(p.label)}</span>
            <span class="item-tag">${esc(p.tag)}</span>
            <button class="item-delete" data-index="${i}" title="Delete">&times;</button>
          </div>
        `).join('');
        for (const btn of profileList.querySelectorAll('.item-delete')) {
          btn.addEventListener('click', async () => {
            const idx = btn.getAttribute('data-index');
            if (!confirm('Delete this profile?')) return;
            try {
              const res = await fetch('/api/settings/profiles/' + idx, { method: 'DELETE' });
              if (res.status === 401) { location.reload(); return; }
              if (!res.ok) throw new Error('Failed');
              await loadProfiles();
            } catch { showStatus(profileStatus, 'Delete failed', true); }
          });
        }
      } catch {
        profileList.innerHTML = '<div class="empty-msg">Failed to load profiles.</div>';
      }
    }

    profileAddBtn.addEventListener('click', async () => {
      if (profileAddBtn.disabled) return;
      const label = profileLabel.value.trim();
      const tag = profileTag.value.trim();
      profileAddBtn.disabled = true;
      try {
        const res = await fetch('/api/settings/profiles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label, tag }),
        });
        if (res.status === 401) { location.reload(); return; }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        showStatus(profileStatus, `Added "${data.entry.label}"`, false);
        profileLabel.value = '';
        profileTag.value = '';
        await loadProfiles();
      } catch (err) {
        showStatus(profileStatus, err.message, true);
      } finally { updateProfileBtn(); }
    });

    // --- Style References ---
    const srefName = document.getElementById('sref-name');
    const srefFile = document.getElementById('sref-file');
    const srefFileText = document.getElementById('sref-file-text');
    const srefAddBtn = document.getElementById('sref-add-btn');
    const srefCount = document.getElementById('sref-count');
    const srefGrid = document.getElementById('sref-grid');
    const srefStatus = document.getElementById('sref-status');

    function updateSrefBtn() {
      srefAddBtn.disabled = !srefName.value.trim() || !srefFile.files.length;
    }
    srefName.addEventListener('input', updateSrefBtn);
    srefFile.addEventListener('change', () => {
      srefFileText.textContent = srefFile.files.length ? srefFile.files[0].name : 'Choose image...';
      updateSrefBtn();
    });

    async function loadSrefs() {
      try {
        const res = await fetch('/api/settings/sref');
        if (res.status === 401) { location.reload(); return; }
        const entries = await res.json();
        srefCount.textContent = entries.length;
        if (entries.length === 0) {
          srefGrid.innerHTML = '<div class="empty-msg">No style references uploaded yet.</div>';
          return;
        }
        srefGrid.innerHTML = entries.map((e) => `
          <div class="sref-card">
            <img src="${esc(e.url)}" alt="${esc(e.name)}" loading="lazy" />
            <div class="sref-card-info">
              <span class="sref-card-name" title="${esc(e.name)}">${esc(e.name)}</span>
              <button class="sref-card-delete" data-index="${e.index}" title="Delete">&times;</button>
            </div>
          </div>
        `).join('');
        for (const btn of srefGrid.querySelectorAll('.sref-card-delete')) {
          btn.addEventListener('click', async () => {
            const idx = btn.getAttribute('data-index');
            if (!confirm('Delete this style reference?')) return;
            try {
              const res = await fetch('/api/settings/sref/' + idx, { method: 'DELETE' });
              if (res.status === 401) { location.reload(); return; }
              if (!res.ok) throw new Error('Failed');
              await loadSrefs();
            } catch { showStatus(srefStatus, 'Delete failed', true); }
          });
        }
      } catch {
        srefGrid.innerHTML = '<div class="empty-msg">Failed to load style references.</div>';
      }
    }

    srefAddBtn.addEventListener('click', async () => {
      if (srefAddBtn.disabled) return;
      const name = srefName.value.trim();
      const file = srefFile.files[0];
      srefAddBtn.disabled = true;
      srefAddBtn.textContent = 'Uploading...';
      try {
        const fd = new FormData();
        fd.append('name', name);
        fd.append('image', file);
        const res = await fetch('/api/settings/sref', { method: 'POST', body: fd });
        if (res.status === 401) { location.reload(); return; }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Upload failed');
        showStatus(srefStatus, `Uploaded "${data.entry.name}"`, false);
        srefName.value = '';
        srefFile.value = '';
        srefFileText.textContent = 'Choose image...';
        await loadSrefs();
      } catch (err) {
        showStatus(srefStatus, err.message, true);
      } finally {
        srefAddBtn.textContent = 'Upload';
        updateSrefBtn();
      }
    });
  </script>
</body>
</html>
