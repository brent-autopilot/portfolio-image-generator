<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Money Machine</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%2334d399'/><stop offset='0.5' stop-color='%2310b981'/><stop offset='1' stop-color='%23059669'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='%23060609'/><path d='M50 16v68' stroke='url(%23g)' stroke-width='2.5' stroke-linecap='round'/><path d='M62 30c0-8-7-12-14-12s-14 4-14 11c0 14 28 8 28 24c0 8-7 13-14 13s-14-5-14-13' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --pass: #34d399;
      --fail: #f87171;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-highlight: rgba(255, 255, 255, 0.15);
      --glass-shadow: rgba(0, 0, 0, 0.4);
      --text: rgba(255, 255, 255, 0.92);
      --text-dim: rgba(255, 255, 255, 0.4);
      --text-mid: rgba(255, 255, 255, 0.6);
      --font: 'Satoshi', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    body {
      background: #050508;
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Background with blur + parallax */
    .bg-layer {
      position: fixed;
      inset: -40px;
      z-index: 0;
      background: url('/bg.png') center center / cover no-repeat;
      opacity: 0.45;
      filter: blur(1px);
      transition: transform 0.15s ease-out;
      will-change: transform;
    }
    .bg-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 20%, transparent 0%, rgba(5,5,8,0.5) 70%),
        radial-gradient(ellipse at 70% 80%, transparent 0%, rgba(5,5,8,0.7) 60%);
    }
    .bg-noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* Glass */
    .glass {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(40px) saturate(1.6);
      -webkit-backdrop-filter: blur(40px) saturate(1.6);
      border: 1px solid var(--glass-border);
      box-shadow:
        inset 0 1px 0 var(--glass-highlight),
        0 8px 32px var(--glass-shadow),
        0 0 0 0.5px rgba(255,255,255,0.05);
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.15s ease-out;
    }

    /* Animated edge glow */
    @property --glow-angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes edgeGlow {
      to { --glow-angle: 360deg; }
    }
    .glass-glow {
      overflow: hidden;
    }
    .glass-glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(
        from var(--glow-angle),
        transparent 0%,
        transparent 30%,
        rgba(255,255,255,0.35) 45%,
        rgba(255,255,255,0.6) 50%,
        rgba(255,255,255,0.35) 55%,
        transparent 70%,
        transparent 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: edgeGlow 4s linear infinite;
      animation-delay: var(--glow-delay, 0s);
      pointer-events: none;
      z-index: 1;
    }

    .glass-tilt {
      transform-style: preserve-3d;
      perspective: 800px;
    }
    .glass-tilt:hover {
      border-color: rgba(255,255,255,0.2);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.25),
        0 8px 40px rgba(0,0,0,0.5),
        0 0 40px rgba(255,255,255,0.04);
    }

    /* Header */
    .header {
      padding: 48px 0 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -2.5px;
      line-height: 1;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-dot {
      width: 14px; height: 14px;
      background: #fff;
      border-radius: 50%;
      display: inline-block;
      margin-right: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.25), 0 0 60px rgba(255,255,255,0.15);
      animation: dot-glow 3s ease-in-out infinite;
    }
    @keyframes dot-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.25), 0 0 60px rgba(255,255,255,0.15); }
      50% { box-shadow: 0 0 30px rgba(255,255,255,0.35), 0 0 90px rgba(255,255,255,0.2); }
    }
    .header-right { display: flex; align-items: center; gap: 24px; }
    .header-sub {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--text-dim);
      font-weight: 500;
    }
    .history-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
    }
    .history-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .history-btn:active { transform: scale(0.96); }

    /* Input */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      margin-bottom: 24px;
      border-radius: 20px;
    }
    .input-name { padding: 36px; border-radius: 20px 0 0 0; }
    .input-thesis { padding: 36px; border-radius: 0 20px 0 0; }
    .input-thesis.glass-glow::before { animation-delay: -2s; }
    .input-bottom {
      grid-column: 1 / -1;
      padding: 36px;
      border-radius: 0 0 20px 20px;
      display: flex;
      gap: 24px;
      align-items: flex-end;
    }
    .input-bottom .bank-selectors { flex: 1; }
    .input-bottom .btn-wrap { flex-shrink: 0; width: 220px; }
    .input-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-dim);
      font-weight: 500;
      margin-bottom: 16px;
      display: block;
    }
    .fund-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      font-family: var(--font);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      padding: 12px 0;
      transition: border-color 0.3s;
    }
    .fund-input::placeholder { color: rgba(255,255,255,0.2); }
    .fund-input:focus { outline: none; border-color: rgba(255,255,255,0.5); }
    .thesis-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      font-family: var(--font);
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      padding: 12px 0;
      resize: none;
      min-height: 60px;
      line-height: 1.5;
      transition: border-color 0.3s;
    }
    .thesis-textarea::placeholder { color: rgba(255,255,255,0.2); }
    .thesis-textarea:focus { outline: none; border-color: rgba(255,255,255,0.5); }
    .bank-selectors { display: flex; gap: 12px; width: 100%; }
    .bank-select-wrap { flex: 1; }
    .bank-select-label {
      font-family: var(--mono);
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 6px;
      display: block;
    }
    .bank-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    .bank-trigger:hover { border-color: rgba(255,255,255,0.2); }
    .bank-trigger-text {
      flex: 1;
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bank-trigger-text.has-value { color: var(--text); }
    .bank-trigger-icon {
      flex-shrink: 0;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
    .bank-selected-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.4;
      max-width: 100%;
      word-break: break-word;
    }
    .bank-selected-tag--style { background: rgba(16,185,129,0.12); color: #34d399; }
    .bank-selected-tag--interp { background: rgba(168,85,247,0.12); color: #c084fc; }
    .bank-clear {
      cursor: pointer;
      opacity: 0.5;
      font-size: 12px;
      flex-shrink: 0;
    }
    .bank-clear:hover { opacity: 1; }

    .bank-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: lbFadeIn 0.2s ease-out;
    }
    .bank-modal-overlay.hidden { display: none; }
    .bank-modal {
      width: 90vw;
      max-width: 700px;
      height: 75vh;
      background: rgba(14,14,18,0.97);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: lbZoomIn 0.25s ease-out;
    }
    .bank-modal-header {
      padding: 20px 24px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }
    .bank-modal-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bank-modal-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .bank-modal-close {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .bank-modal-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .bank-modal-search {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 10px 14px;
      box-sizing: border-box;
      margin-bottom: 4px;
    }
    .bank-modal-search::placeholder { color: rgba(255,255,255,0.2); }
    .bank-modal-search:focus { outline: none; border-color: rgba(255,255,255,0.25); }
    .bank-modal-count {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-dim);
      padding: 0 2px 8px;
    }
    .bank-modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 24px 20px;
    }
    .bank-modal-list::-webkit-scrollbar { width: 4px; }
    .bank-modal-list::-webkit-scrollbar-track { background: transparent; }
    .bank-modal-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    .bank-modal-item {
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-mid);
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s;
      line-height: 1.5;
      margin-bottom: 2px;
    }
    .bank-modal-item:hover { background: rgba(255,255,255,0.08); color: var(--text); }

    /* Style bank toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .toggle-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      user-select: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .toggle-label.active { color: rgba(255,255,255,0.7); }
    .toggle-track {
      position: relative;
      width: 36px;
      height: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.25s, border-color 0.25s;
    }
    .toggle-track.on {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.3);
    }
    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      transition: transform 0.25s, background 0.25s;
    }
    .toggle-track.on .toggle-thumb {
      transform: translateX(16px);
      background: #fff;
    }

    /* Generate button */
    .generate-btn {
      margin-top: 20px;
      width: 100%;
      background: #fff;
      color: #0a0a0f;
      border: none;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 16px 32px;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s, box-shadow 0.3s, background 0.2s;
      box-shadow: 0 4px 24px rgba(255,255,255,0.1);
    }
    .generate-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 32px rgba(255,255,255,0.15); }
    .generate-btn:active { transform: scale(0.97) translateY(1px); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .generate-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
      pointer-events: none;
    }
    .generate-btn.running {
      background: rgba(255,255,255,0.85);
      animation: btnPulse 1.8s ease-in-out infinite;
    }
    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 4px 24px rgba(255,255,255,0.1); }
      50% { box-shadow: 0 4px 40px rgba(255,255,255,0.2), 0 0 60px rgba(255,255,255,0.08); }
    }
    .btn-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transform: scale(0);
      animation: ripple 0.6s ease-out;
      pointer-events: none;
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    /* Pipeline */
    .pipeline {
      border-radius: 16px;
      padding: 20px 32px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
    }
    .pipeline.hidden { display: none; }
    .pipeline.processing {
      animation: glassShimmer 3s ease-in-out infinite;
    }
    @keyframes glassShimmer {
      0%, 100% { box-shadow: inset 0 1px 0 var(--glass-highlight), 0 8px 32px var(--glass-shadow); }
      50% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 8px 48px rgba(0,0,0,0.5), 0 0 80px rgba(255,255,255,0.03); }
    }
    .stage {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
      transition: color 0.3s;
    }
    .stage-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
      transition: box-shadow 0.3s;
    }
    .stage-arrow { margin: 0 24px; color: rgba(255,255,255,0.12); font-size: 12px; }
    .stage-pending { color: rgba(255,255,255,0.15); }
    .stage-active { color: #fff; }
    .stage-active .stage-dot {
      animation: stagePulse 1s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(255,255,255,0.3);
    }
    @keyframes stagePulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 12px rgba(255,255,255,0.3); }
      50% { opacity: 0.4; transform: scale(1.5); box-shadow: 0 0 20px rgba(255,255,255,0.4); }
    }
    .stage-done { color: var(--pass); }
    .stage-done .stage-dot { box-shadow: 0 0 8px rgba(52,211,153,0.4); }
    .stage-error { color: var(--fail); }

    /* Processing spinner overlay */
    .processing-overlay {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-mid);
      font-weight: 500;
      animation: slideInRight 0.4s ease-out;
    }
    .processing-overlay.hidden { display: none; }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Concepts */
    .concepts {
      border-radius: 16px;
      padding: 24px 32px;
      margin-bottom: 24px;
      border-left: 3px solid rgba(255,255,255,0.2);
    }
    .concepts.hidden { display: none; }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-dim);
      font-weight: 500;
      margin-bottom: 16px;
    }
    .concept-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      animation: fadeRow 0.3s ease-out both;
    }
    .concept-row:last-child { border-bottom: none; }
    .concept-row:nth-child(1) { animation-delay: 0.05s; }
    .concept-row:nth-child(2) { animation-delay: 0.15s; }
    .concept-row:nth-child(3) { animation-delay: 0.25s; }
    @keyframes fadeRow {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .concept-num { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.5); width: 20px; flex-shrink: 0; }
    .concept-label { font-size: 15px; font-weight: 700; color: var(--text); }
    .concept-style {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--pass);
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.15);
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      flex-shrink: 0;
    }
    .concept-interp {
      font-family: var(--mono);
      font-size: 9px;
      color: rgba(167,139,250,0.9);
      background: rgba(167,139,250,0.08);
      border: 1px solid rgba(167,139,250,0.15);
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      flex-shrink: 0;
    }
    .concept-prompt { font-family: var(--mono); font-size: 10px; color: var(--text-dim); margin-left: auto; max-width: 40%; text-align: right; flex-shrink: 0; }

    /* Error */
    .error-bar {
      border-radius: 16px;
      border-left: 3px solid var(--fail);
      padding: 20px 28px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--fail);
      background: rgba(248,113,113,0.08);
      backdrop-filter: blur(24px);
    }
    .error-bar.hidden { display: none; }

    /* Results */
    .results-section.hidden { display: none; }
    .results-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .results-header h2 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 700;
    }
    .results-header--pass h2 { color: var(--pass); }
    .results-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--glass-border), transparent); }

    /* Image grid */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }
    .image-card {
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      animation: cardIn 0.5s ease-out both;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .image-card:hover {
      box-shadow:
        0 20px 60px rgba(0,0,0,0.6),
        0 0 40px rgba(255,255,255,0.05),
        inset 0 1px 0 rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.2);
    }
    .image-card:nth-child(1) { animation-delay: 0.1s; }
    .image-card:nth-child(2) { animation-delay: 0.25s; }
    .image-card:nth-child(3) { animation-delay: 0.4s; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .image-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .image-card-info { padding: 18px 20px; }
    .image-card-concept { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .image-card-style {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--pass);
      margin-bottom: 6px;
      opacity: 0.7;
    }
    .image-card-prompt { font-family: var(--mono); font-size: 10px; color: var(--text-dim); line-height: 1.5; margin-bottom: 12px; }
    .image-card-actions { display: flex; align-items: center; gap: 10px; }
    .verdict-tag {
      display: inline-block;
      font-size: 9px; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 5px 12px;
      border-radius: 6px;
    }
    .verdict-pass { background: rgba(52,211,153,0.15); color: var(--pass); border: 1px solid rgba(52,211,153,0.25); }
    .verdict-fail { background: rgba(248,113,113,0.12); color: var(--fail); border: 1px solid rgba(248,113,113,0.2); }
    .verdict-skip { background: rgba(255,255,255,0.05); color: var(--text-dim); border: 1px solid rgba(255,255,255,0.08); }
    .verdict-error { background: rgba(248,113,113,0.08); color: var(--fail); border: 1px solid rgba(248,113,113,0.15); }
    .image-card-reason { font-size: 10px; color: var(--text-dim); margin-top: 10px; line-height: 1.4; }

    /* Scattered gallery */
    .gallery-scatter {
      position: relative;
      width: 100%;
      height: 1600px;
      overflow: visible;
      margin-bottom: 40px;
    }
    .gallery-card {
      position: absolute;
      will-change: transform, filter, opacity;
      transition: box-shadow 0.4s, filter 0.5s ease-in-out, opacity 0.5s ease-in-out, transform 0.12s ease-out;
      cursor: pointer;
      filter: blur(0px);
    }
    .gallery-card:hover {
      z-index: 100 !important;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(255,255,255,0.06);
    }
    .gallery-card--pass { width: 280px; }
    .gallery-card--fail { width: 200px; }
    .gallery-card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    .gallery-card-meta {
      padding: 10px 2px 0;
    }
    .gallery-card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gallery-card-detail {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--text-dim);
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gallery-card-interp {
      font-family: var(--mono);
      font-size: 8px;
      color: rgba(167,139,250,0.7);
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gallery-card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .gallery-card-verdict {
      display: inline-block;
      font-family: var(--mono);
      font-size: 7px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .gallery-card-verdict--pass { color: var(--pass); }
    .gallery-card-verdict--fail { color: var(--fail); opacity: 0.6; }
    .gallery-card-verdict--skip { color: var(--text-dim); }
    .gallery-card-verdict--pending { color: rgba(255,255,255,0.3); font-style: italic; }
    .gallery-dl-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: var(--mono);
      font-size: 7px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .gallery-dl-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); }
    .gallery-upscale-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-family: var(--mono);
      font-size: 7px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .gallery-upscale-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); }
    .gallery-upscale-btn.loading {
      pointer-events: none;
      opacity: 0.5;
    }
    .gallery-upscale-btn.done {
      display: none;
    }
    .upscale-spinner {
      display: inline-block;
      width: 8px;
      height: 8px;
      border: 1.5px solid rgba(255,255,255,0.2);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: upscaleSpin 0.6s linear infinite;
    }
    @keyframes upscaleSpin { to { transform: rotate(360deg); } }
    .gallery-card--rejected {
      opacity: 0.45;
      filter: grayscale(0.6);
    }
    .gallery-card--rejected:hover {
      opacity: 0.7;
      filter: grayscale(0.3);
    }
    /* Rating sidebar — fixed left edge */
    .rating-sidebar {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rating-sidebar.hidden { display: none; }

    .gen-rating-strip {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      background: rgba(10, 10, 14, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      user-select: none;
      cursor: default;
      transition: border-color 0.2s, background 0.2s;
    }
    .gen-rating-strip:hover {
      border-color: rgba(255,255,255,0.18);
      background: rgba(10, 10, 14, 0.9);
    }
    .gen-rating-strip .strip-header {
      color: var(--text-mid);
      font-weight: 700;
      font-size: 9px;
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .comp-row {
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
    }
    .comp-row .comp-label {
      width: 42px;
      flex-shrink: 0;
      font-size: 7px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .comp-row .comp-value {
      flex: 1;
      font-size: 6.5px;
      color: rgba(255,255,255,0.3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      cursor: help;
    }
    .comp-row .comp-btns {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }
    .comp-row .rate-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      font-size: 8px;
      line-height: 1;
      transition: all 0.15s;
      color: rgba(255,255,255,0.25);
    }
    .comp-row .rate-btn:hover {
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }
    .comp-row .rate-btn.active-up {
      border-color: var(--pass);
      background: rgba(52, 211, 153, 0.15);
      color: var(--pass);
    }
    .comp-row .rate-btn.active-down {
      border-color: var(--fail);
      background: rgba(248, 113, 113, 0.15);
      color: var(--fail);
    }
    .comp-row .rate-btn.active-neutral {
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }
    .gen-rating-strip.expired {
      opacity: 0.4;
      pointer-events: none;
    }
    .gen-rating-strip .expired-msg {
      font-size: 7px;
      color: var(--text-dim);
      font-style: italic;
    }
    .comp-row.comp-empty { display: none; }

    /* Hover-to-highlight: dim/brighten cards by generation */
    .gallery-card {
      transition: box-shadow 0.4s, filter 0.5s ease-in-out, opacity 0.5s ease-in-out, transform 0.12s ease-out;
    }
    .gallery-card.gen-dimmed {
      opacity: 0.2 !important;
      filter: grayscale(0.5) blur(1.5px) !important;
    }
    .gallery-card.gen-highlighted {
      filter: brightness(1.1) !important;
    }

    @media (max-width: 768px) {
      .rating-sidebar {
        left: 50%;
        top: auto;
        bottom: 12px;
        transform: translateX(-50%);
        flex-direction: row;
      }
      .gen-rating-strip { min-width: auto; }
    }

    @keyframes galleryFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .gallery-card { animation: galleryFadeIn 0.5s ease-out forwards; }

    /* Lightbox */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      animation: lbFadeIn 0.25s ease-out;
    }
    .lightbox-overlay.hidden { display: none; }
    @keyframes lbFadeIn { from { opacity: 0; } to { opacity: 1; } }
    .lightbox-content {
      position: relative;
      max-width: min(600px, 85vw);
      max-height: 85vh;
      cursor: default;
      animation: lbZoomIn 0.3s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @keyframes lbZoomIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    .lightbox-img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 12px;
      display: block;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }
    .lightbox-meta {
      padding: 16px 4px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: center;
    }
    .lightbox-concept {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .lightbox-prompt {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.6;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .lightbox-dl {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-mid);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .lightbox-dl:hover { color: var(--text); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.14); }

    @media (max-width: 768px) {
      .gallery-scatter {
        height: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        padding: 20px 0;
      }
      .gallery-card {
        position: static !important;
        transform: none !important;
        width: 90% !important;
        max-width: 280px;
      }
      .gallery-card-img { border-radius: 10px; }
      .lightbox-img { max-width: 95vw; max-height: 70vh; }
    }

    /* (rejected toggle removed -- now inline in scattered gallery) */

    /* History modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.25s ease-out;
    }
    .modal-overlay.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: 90%; max-width: 1000px; max-height: 80vh;
      border-radius: 20px;
      padding: 36px;
      overflow-y: auto;
      animation: modalIn 0.3s ease-out;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .modal-title { font-size: 20px; font-weight: 700; }
    .modal-close {
      background: none; border: none; color: var(--text-dim); font-size: 24px;
      cursor: pointer; padding: 4px 8px; transition: color 0.2s;
    }
    .modal-close:hover { color: var(--text); }
    .history-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;
    }
    .history-card {
      border-radius: 12px; overflow: hidden;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      transition: border-color 0.2s;
    }
    .history-card:hover { border-color: rgba(255,255,255,0.15); }
    .history-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .history-card-info { padding: 10px 12px; }
    .history-card-fund { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-card-concept { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; }
    .history-card-date { font-family: var(--mono); font-size: 9px; color: rgba(255,255,255,0.2); margin-bottom: 8px; }
    .download-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-mid);
      font-family: var(--font);
      font-size: 9px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      padding: 5px 10px; border-radius: 6px;
      cursor: pointer; text-decoration: none;
      transition: all 0.2s;
    }
    .download-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); }
    .download-btn:active { transform: scale(0.95); }
    .history-empty { color: var(--text-dim); font-size: 13px; padding: 40px 0; text-align: center; }

    /* Login gate */
    .login-gate {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 8, 0.95);
      backdrop-filter: blur(20px);
      animation: fadeIn 0.4s ease-out;
    }
    .login-gate.hidden { display: none; }
    .login-card {
      width: 380px;
      max-width: calc(100vw - 48px);
      padding: 48px 40px;
      border-radius: 24px;
      text-align: center;
      animation: modalIn 0.5s ease-out;
    }
    .login-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-dim);
      margin-bottom: 36px;
    }
    .login-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      font-weight: 500;
      padding: 16px 20px;
      text-align: center;
      letter-spacing: 4px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .login-input::placeholder { color: rgba(255,255,255,0.15); letter-spacing: 1px; }
    .login-input:focus {
      outline: none;
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
    }
    .login-input.login-error {
      border-color: var(--fail);
      animation: loginShake 0.4s ease-out;
    }
    @keyframes loginShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .login-btn {
      width: 100%;
      margin-top: 16px;
      background: #fff;
      color: #0a0a0f;
      border: none;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.3s;
      box-shadow: 0 4px 24px rgba(255,255,255,0.1);
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 32px rgba(255,255,255,0.15); }
    .login-btn:active { transform: scale(0.97); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .login-dot {
      width: 10px; height: 10px;
      background: #fff;
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(255,255,255,0.25), 0 0 60px rgba(255,255,255,0.15);
      animation: dot-glow 3s ease-in-out infinite;
    }

    @media (max-width: 768px) {
      .input-grid { grid-template-columns: 1fr; border-radius: 16px; }
      .input-name { border-radius: 16px 16px 0 0; }
      .input-thesis { border-radius: 0; }
      .input-bottom { flex-direction: column; border-radius: 0 0 16px 16px; }
      .input-bottom .btn-wrap { width: 100%; }
      .bank-selectors { flex-direction: column; }
      .image-grid { grid-template-columns: 1fr; }
      .history-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .header h1 { font-size: 36px; }
      .header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .header-right { align-self: flex-end; }
      .fund-input { font-size: 20px; }
      .concept-prompt { display: none; }
    }
  </style>
</head>
<body>
  <!-- Login gate -->
  <div id="login-gate" class="login-gate">
    <div class="login-card glass glass-glow">
      <div class="login-dot"></div>
      <div class="login-title">The Money Machine</div>
      <div class="login-sub">Enter password to continue</div>
      <input id="login-password" type="password" class="login-input" placeholder="Password" autocomplete="off" />
      <button id="login-btn" class="login-btn">Enter</button>
    </div>
  </div>

  <div class="bg-layer" id="bg-layer"></div>
  <div class="bg-noise"></div>

  <div class="container" id="main-container" style="display:none">

    <div class="header">
      <div><h1><span class="header-dot"></span>The Money Machine</h1></div>
      <div class="header-right">
        <span class="header-sub">Fund Image Generation</span>
        <a href="/settings.html" class="history-btn">Settings</a>
        <button class="history-btn" id="history-btn">Archive</button>
      </div>
    </div>

    <div class="input-grid">
      <div class="input-name glass glass-glow">
        <label for="fund-name" class="input-label">Fund Name</label>
        <input id="fund-name" type="text" class="fund-input" placeholder="Autopilot Alpha Fund" autocomplete="off" />
      </div>
      <div class="input-thesis glass glass-glow">
        <label for="fund-thesis" class="input-label">Fund Thesis</label>
        <textarea id="fund-thesis" class="thesis-textarea" placeholder="Hedge the AI Bubble with diversified short positions across overvalued tech sectors"></textarea>
      </div>
      <div class="input-bottom glass glass-glow">
        <div class="bank-selectors">
          <div class="bank-select-wrap">
            <span class="bank-select-label">Style Override</span>
            <div id="style-trigger" class="bank-trigger">
              <span id="style-trigger-text" class="bank-trigger-text">Browse styles...</span>
              <span class="bank-trigger-icon">&#128269;</span>
            </div>
            <div id="style-selected"></div>
          </div>
          <div class="bank-select-wrap">
            <span class="bank-select-label">Interpretation Override</span>
            <div id="interp-trigger" class="bank-trigger">
              <span id="interp-trigger-text" class="bank-trigger-text">Browse interpretations...</span>
              <span class="bank-trigger-icon">&#128269;</span>
            </div>
            <div id="interp-selected"></div>
          </div>
        </div>
        <div class="btn-wrap">
          <div class="toggle-row">
            <div id="style-bank-toggle" class="toggle-track on" role="switch" aria-checked="true" tabindex="0">
              <div class="toggle-thumb"></div>
            </div>
            <span id="style-bank-label" class="toggle-label active">Editorial</span>
          </div>
          <button id="generate-btn" class="generate-btn">Generate</button>
        </div>
      </div>
    </div>

    <div id="pipeline-section" class="pipeline glass glass-glow hidden">
      <div id="stage-theme" class="stage stage-pending"><span class="stage-dot"></span><span>Theme</span></div>
      <span class="stage-arrow">&rarr;</span>
      <div id="stage-mj" class="stage stage-pending"><span class="stage-dot"></span><span>Midjourney</span></div>
      <span class="stage-arrow">&rarr;</span>
      <div id="stage-qc" class="stage stage-pending"><span class="stage-dot"></span><span>QC Gate</span></div>
    </div>

    <div id="concepts-preview" class="concepts glass glass-glow hidden">
      <div class="section-title">Concepts</div>
      <div id="concepts-list"></div>
    </div>

    <div id="error-display" class="error-bar hidden"><span id="error-text"></span></div>

    <section id="gallery-section" class="results-section hidden">
      <div class="results-header results-header--pass"><h2>Results</h2><div class="results-line"></div></div>
      <div id="gallery-scatter" class="gallery-scatter"></div>
    </section>
    <div id="rating-sidebar" class="rating-sidebar hidden"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox-overlay hidden">
    <div class="lightbox-content">
      <img id="lightbox-img" class="lightbox-img" src="" alt="" />
      <div class="lightbox-meta">
        <span id="lightbox-concept" class="lightbox-concept"></span>
        <span id="lightbox-prompt" class="lightbox-prompt"></span>
        <a id="lightbox-dl" class="lightbox-dl" href="" download>&#8595; Download</a>
      </div>
    </div>
  </div>

  <!-- Bank browser modal -->
  <div id="bank-modal" class="bank-modal-overlay hidden">
    <div class="bank-modal">
      <div class="bank-modal-header">
        <div class="bank-modal-title-row">
          <span id="bank-modal-title" class="bank-modal-title">Styles</span>
          <button id="bank-modal-close" class="bank-modal-close">&times;</button>
        </div>
        <input id="bank-modal-search" class="bank-modal-search" type="text" placeholder="Search..." autocomplete="off" />
        <div id="bank-modal-count" class="bank-modal-count"></div>
      </div>
      <div id="bank-modal-list" class="bank-modal-list"></div>
    </div>
  </div>

  <!-- Processing indicator -->
  <div id="processing-overlay" class="processing-overlay glass hidden">
    <div class="spinner"></div>
    <span id="processing-label">Processing</span>
  </div>

  <!-- History modal -->
  <div id="history-modal" class="modal-overlay hidden">
    <div class="modal glass">
      <div class="modal-header">
        <span class="modal-title">Archive</span>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div id="history-content"></div>
    </div>
  </div>

  <script>
    // Auth gate
    const loginGate = document.getElementById('login-gate');
    const loginPassword = document.getElementById('login-password');
    const loginBtn = document.getElementById('login-btn');
    const mainContainer = document.getElementById('main-container');

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/check');
        const data = await res.json();
        if (data.authed) unlockApp();
      } catch {}
    }

    function unlockApp() {
      loginGate.classList.add('hidden');
      mainContainer.style.display = '';
    }

    async function attemptLogin() {
      const pw = loginPassword.value;
      if (!pw) { loginPassword.focus(); return; }
      loginBtn.disabled = true;
      loginBtn.textContent = '...';
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        if (res.ok) {
          unlockApp();
        } else {
          loginPassword.classList.add('login-error');
          loginPassword.value = '';
          loginPassword.focus();
          setTimeout(() => loginPassword.classList.remove('login-error'), 500);
        }
      } catch {
        loginPassword.classList.add('login-error');
        setTimeout(() => loginPassword.classList.remove('login-error'), 500);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Enter';
      }
    }

    loginBtn.addEventListener('click', attemptLogin);
    loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
    checkAuth();

    const bgLayer = document.getElementById('bg-layer');
    const fundNameInput = document.getElementById('fund-name');
    const fundThesisInput = document.getElementById('fund-thesis');
    const styleBankToggle = document.getElementById('style-bank-toggle');
    const styleBankLabel = document.getElementById('style-bank-label');
    let styleBankEnabled = true;

    let bankStyles = [];
    let bankInterps = [];
    let selectedStyle = null;
    let selectedInterp = null;

    const styleTrigger = document.getElementById('style-trigger');
    const styleTriggerText = document.getElementById('style-trigger-text');
    const styleSelectedEl = document.getElementById('style-selected');
    const interpTrigger = document.getElementById('interp-trigger');
    const interpTriggerText = document.getElementById('interp-trigger-text');
    const interpSelectedEl = document.getElementById('interp-selected');

    const bankModal = document.getElementById('bank-modal');
    const bankModalTitle = document.getElementById('bank-modal-title');
    const bankModalClose = document.getElementById('bank-modal-close');
    const bankModalSearch = document.getElementById('bank-modal-search');
    const bankModalCount = document.getElementById('bank-modal-count');
    const bankModalList = document.getElementById('bank-modal-list');

    let _bankModalItems = [];
    let _bankModalCallback = null;

    (async function loadBanks() {
      try {
        const res = await fetch('/api/banks');
        if (!res.ok) return;
        const data = await res.json();
        bankStyles = data.styles || [];
        bankInterps = data.interpretations || [];
      } catch {}
    })();

    function openBankModal(title, items, onSelect) {
      _bankModalItems = items;
      _bankModalCallback = onSelect;
      bankModalTitle.textContent = title;
      bankModalSearch.value = '';
      renderBankModalList('');
      bankModal.classList.remove('hidden');
      setTimeout(() => bankModalSearch.focus(), 100);
    }

    function closeBankModal() {
      bankModal.classList.add('hidden');
      _bankModalCallback = null;
    }

    function renderBankModalList(query) {
      const q = query.toLowerCase();
      const filtered = q ? _bankModalItems.filter(s => s.toLowerCase().includes(q)) : _bankModalItems;
      bankModalCount.textContent = `${filtered.length} of ${_bankModalItems.length}`;
      bankModalList.innerHTML = filtered.map(s =>
        `<div class="bank-modal-item">${esc(s)}</div>`
      ).join('');
      for (const item of bankModalList.children) {
        item.addEventListener('click', () => {
          if (_bankModalCallback) _bankModalCallback(item.textContent);
          closeBankModal();
        });
      }
    }

    bankModalSearch.addEventListener('input', () => renderBankModalList(bankModalSearch.value));
    bankModalClose.addEventListener('click', closeBankModal);
    bankModal.addEventListener('click', (e) => { if (e.target === bankModal) closeBankModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !bankModal.classList.contains('hidden')) closeBankModal();
    });

    function renderSelectedTag(value, el, tagClass, onClear) {
      if (!value) { el.innerHTML = ''; return; }
      el.innerHTML = `<span class="bank-selected-tag ${tagClass}">${esc(value)}<span class="bank-clear" title="Clear">&times;</span></span>`;
      el.querySelector('.bank-clear').addEventListener('click', onClear);
    }

    styleTrigger.addEventListener('click', () => {
      openBankModal('Styles', bankStyles, (val) => {
        selectedStyle = val;
        styleTriggerText.textContent = val;
        styleTriggerText.classList.add('has-value');
        renderSelectedTag(val, styleSelectedEl, 'bank-selected-tag--style', () => {
          selectedStyle = null;
          styleTriggerText.textContent = 'Browse styles...';
          styleTriggerText.classList.remove('has-value');
          styleSelectedEl.innerHTML = '';
        });
      });
    });

    interpTrigger.addEventListener('click', () => {
      openBankModal('Interpretations', bankInterps, (val) => {
        selectedInterp = val;
        interpTriggerText.textContent = val;
        interpTriggerText.classList.add('has-value');
        renderSelectedTag(val, interpSelectedEl, 'bank-selected-tag--interp', () => {
          selectedInterp = null;
          interpTriggerText.textContent = 'Browse interpretations...';
          interpTriggerText.classList.remove('has-value');
          interpSelectedEl.innerHTML = '';
        });
      });
    });

    function setStyleBankToggle(on) {
      styleBankEnabled = on;
      styleBankToggle.classList.toggle('on', on);
      styleBankToggle.setAttribute('aria-checked', String(on));
      styleBankLabel.classList.toggle('active', on);
      styleBankLabel.textContent = on ? 'Editorial' : 'Raw';
    }
    styleBankToggle.addEventListener('click', () => setStyleBankToggle(!styleBankEnabled));
    styleBankLabel.addEventListener('click', () => setStyleBankToggle(!styleBankEnabled));
    styleBankToggle.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setStyleBankToggle(!styleBankEnabled); }
    });

    const generateBtn = document.getElementById('generate-btn');
    const pipelineSection = document.getElementById('pipeline-section');
    const stageTheme = document.getElementById('stage-theme');
    const stageMj = document.getElementById('stage-mj');
    const stageQc = document.getElementById('stage-qc');
    const conceptsPreview = document.getElementById('concepts-preview');
    const conceptsList = document.getElementById('concepts-list');
    const errorDisplay = document.getElementById('error-display');
    const errorText = document.getElementById('error-text');
    const gallerySection = document.getElementById('gallery-section');
    const galleryScatter = document.getElementById('gallery-scatter');
    const ratingSidebar = document.getElementById('rating-sidebar');
    const processingOverlay = document.getElementById('processing-overlay');
    const processingLabel = document.getElementById('processing-label');
    const historyBtn = document.getElementById('history-btn');
    const historyModal = document.getElementById('history-modal');
    const modalClose = document.getElementById('modal-close');
    const historyContent = document.getElementById('history-content');

    // Background parallax
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      bgLayer.style.transform = `translate(${x}px, ${y}px)`;
    });

    // Glass tile parallax + glow on hover
    function initTileParallax(card) {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;
        const rx = ((cy / rect.height) - 0.5) * -8;
        const ry = ((cx / rect.width) - 0.5) * 8;
        card.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(4px)`;
        const gx = (cx / rect.width) * 100;
        const gy = (cy / rect.height) * 100;
        card.style.background = `radial-gradient(circle at ${gx}% ${gy}%, rgba(255,255,255,0.1) 0%, var(--glass-bg) 60%)`;
      });
      card.addEventListener('mouseleave', () => {
        card.style.transform = '';
        card.style.background = '';
      });
    }

    // Button ripple (skip when disabled)
    generateBtn.addEventListener('click', (e) => {
      if (generateBtn.disabled) return;
      const rect = generateBtn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'btn-ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      generateBtn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });

    function setStage(el, state) { el.className = `stage stage-${state}`; }

    const stageLabels = {
      generating_theme: 'Generating themes',
      generating_images: 'Creating images',
      images_ready: 'Running QC',
      qc_check: 'Running QC',
    };

    function resetUI() {
      cardCounter = 0;
      _currentJobId = null;
      _genRatings = {};
      pipelineSection.classList.add('hidden');
      pipelineSection.classList.remove('processing');
      gallerySection.classList.add('hidden');
      galleryScatter.innerHTML = '';
      ratingSidebar.classList.add('hidden');
      ratingSidebar.innerHTML = '';
      closeLightbox();
      conceptsPreview.classList.add('hidden');
      conceptsList.innerHTML = '';
      errorDisplay.classList.add('hidden');
      processingOverlay.classList.add('hidden');
      setStage(stageTheme, 'pending');
      setStage(stageMj, 'pending');
      setStage(stageQc, 'pending');
      selectedStyle = null;
      selectedInterp = null;
      styleTriggerText.textContent = 'Browse styles...';
      styleTriggerText.classList.remove('has-value');
      interpTriggerText.textContent = 'Browse interpretations...';
      interpTriggerText.classList.remove('has-value');
      styleSelectedEl.innerHTML = '';
      interpSelectedEl.innerHTML = '';
      closeBankModal();
    }

    function updateStages(stage) {
      const map = {
        queued:            ['pending','pending','pending'],
        generating_theme:  ['active','pending','pending'],
        generating_images: ['done','active','pending'],
        images_ready:      ['done','done','active'],
        qc_check:          ['done','done','active'],
        complete:          ['done','done','done'],
        error:             ['error','error','error'],
      };
      const [t,m,q] = map[stage] || ['pending','pending','pending'];
      setStage(stageTheme, t);
      setStage(stageMj, m);
      setStage(stageQc, q);

      if (stageLabels[stage]) {
        processingLabel.textContent = stageLabels[stage];
        processingOverlay.classList.remove('hidden');
        pipelineSection.classList.add('processing');
      } else {
        processingOverlay.classList.add('hidden');
        pipelineSection.classList.remove('processing');
      }
    }

    function esc(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
    function safeUrl(url) {
      if (!url) return '';
      try { const u = new URL(url); return ['http:', 'https:'].includes(u.protocol) ? u.href : ''; }
      catch { return url.startsWith('/') ? encodeURI(url) : ''; }
    }

    let cardCounter = 0;
    function renderImageCard(img) {
      const card = document.createElement('div');
      card.className = 'image-card glass glass-glow glass-tilt';
      const delay = -(cardCounter++ * 1.3);
      card.style.setProperty('--glow-delay', `${delay}s`);
      let vc = 'verdict-skip';
      if (img.verdict === 'PASS') vc = 'verdict-pass';
      else if (img.verdict === 'FAIL') vc = 'verdict-fail';
      else if (img.verdict === 'ERROR') vc = 'verdict-error';

      card.innerHTML = `
        <img src="${safeUrl(img.url)}" alt="" loading="lazy" />
        <div class="image-card-info">
          ${img.concept ? `<div class="image-card-concept">${esc(img.concept)}</div>` : ''}
          ${img.style ? `<div class="image-card-style">${esc(img.style)}</div>` : ''}
          ${img.prompt ? `<div class="image-card-prompt">${esc(img.prompt)}</div>` : ''}
          <div class="image-card-actions">
            <span class="verdict-tag ${vc}">${esc(img.verdict)}</span>
          </div>
          ${img.reason ? `<div class="image-card-reason">${esc(img.reason)}</div>` : ''}
        </div>
      `;
      initTileParallax(card);
      return card;
    }

    const GALLERY_SLOTS = [
      { x: 3,  y: 20,   depth: 0.35 },
      { x: 36, y: 0,    depth: 0.72 },
      { x: 68, y: 40,   depth: 1.0  },
      { x: 5,  y: 420,  depth: 0.90 },
      { x: 38, y: 390,  depth: 0.42 },
      { x: 67, y: 440,  depth: 0.65 },
      { x: 2,  y: 800,  depth: 0.55 },
      { x: 37, y: 770,  depth: 0.95 },
      { x: 69, y: 820,  depth: 0.30 },
      { x: 4,  y: 1180, depth: 0.80 },
      { x: 35, y: 1150, depth: 0.48 },
      { x: 68, y: 1200, depth: 0.60 },
    ];

    let _currentJobId = null;

    function renderGalleryCard(img, index) {
      const slot = GALLERY_SLOTS[index % GALLERY_SLOTS.length];
      const rotation = (index % 2 === 0 ? 1 : -1) * (1 + (index * 0.7) % 2.5);
      const card = document.createElement('div');

      const hasVerdict = img.verdict && img.verdict !== 'skipped';
      const isRejected = img.verdict === 'FAIL' || img.verdict === 'ERROR';
      card.className = `gallery-card gallery-card--pass${isRejected ? ' gallery-card--rejected' : ''}`;
      card.dataset.depth = slot.depth;
      card.dataset.genIndex = img.genIndex != null ? img.genIndex : 0;
      card.style.left = `${slot.x}%`;
      card.style.top = `${slot.y}px`;
      card.style.zIndex = Math.round(slot.depth * 10);
      card.style.transform = `rotate(${rotation.toFixed(1)}deg)`;
      card.style.animationDelay = `${index * 0.12}s`;
      card.dataset.baseRotation = rotation.toFixed(1);

      let verdictLabel = '';
      let verdictClass = '';
      if (!hasVerdict) {
        verdictLabel = 'checking...';
        verdictClass = 'gallery-card-verdict--pending';
      } else if (img.verdict === 'PASS') {
        verdictLabel = 'PASS';
        verdictClass = 'gallery-card-verdict--pass';
      } else {
        verdictLabel = img.verdict;
        verdictClass = 'gallery-card-verdict--fail';
      }

      const isUpscaled = img.upscaled === true;
      const imgUrl = safeUrl(img.url);
      card.innerHTML = `
        <img class="gallery-card-img" src="${imgUrl}" alt="" loading="lazy" />
        <div class="gallery-card-meta">
          ${img.concept ? `<div class="gallery-card-title">${esc(img.concept)}</div>` : ''}
          ${img.style ? `<div class="gallery-card-detail">${esc(img.style)}</div>` : ''}
          ${img.interpretation ? `<div class="gallery-card-interp">${esc(img.interpretation)}</div>` : ''}
          <div class="gallery-card-actions">
            <span class="gallery-card-verdict ${verdictClass}">${esc(verdictLabel)}</span>
            ${!isUpscaled ? `<button class="gallery-upscale-btn" data-index="${index}" onclick="event.stopPropagation()">&#8593; HD</button>` : ''}
            <a class="gallery-dl-btn" href="${imgUrl}" download onclick="event.stopPropagation()">&#8595;</a>
          </div>
        </div>
      `;

      const upscaleBtn = card.querySelector('.gallery-upscale-btn');
      if (upscaleBtn) {
        upscaleBtn.addEventListener('click', async () => {
          if (upscaleBtn.classList.contains('loading')) return;
          upscaleBtn.classList.add('loading');
          upscaleBtn.innerHTML = '<span class="upscale-spinner"></span>';
          try {
            const res = await fetch('/api/upscale', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jobId: _currentJobId, imageIndex: img.rawIndex != null ? img.rawIndex : index }),
            });
            if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || 'Upscale failed'); }
            const data = await res.json();
            const newUrl = safeUrl(data.url);
            const cardImg = card.querySelector('.gallery-card-img');
            if (cardImg) cardImg.src = newUrl;
            const dlBtn = card.querySelector('.gallery-dl-btn');
            if (dlBtn) dlBtn.href = newUrl;
            img.url = data.url;
            img.upscaled = true;
            upscaleBtn.classList.add('done');
          } catch (err) {
            upscaleBtn.classList.remove('loading');
            upscaleBtn.innerHTML = '&#8593; HD';
            console.error('Upscale error:', err.message);
          }
        });
      }

      card.addEventListener('click', () => openLightbox(img));
      return card;
    }

    let _genRatings = {};
    let _ratingStrips = [];

    function expireAllStrips() {
      for (const s of _ratingStrips) {
        if (s.classList.contains('expired')) continue;
        s.classList.add('expired');
        if (!s.querySelector('.expired-msg')) {
          s.querySelector('.strip-header').insertAdjacentHTML('afterend', '<span class="expired-msg">session expired</span>');
        }
      }
    }

    function buildCompRow(genIndex, component, label, value) {
      const row = document.createElement('div');
      row.className = 'comp-row' + (value ? '' : ' comp-empty');
      row.innerHTML = `
        <span class="comp-label">${esc(label)}</span>
        <span class="comp-value" title="${esc(value || '')}">${esc(value ? (value.length > 25 ? value.slice(0, 22) + '...' : value) : '')}</span>
        <span class="comp-btns">
          <button class="rate-btn" data-rating="up" data-comp="${component}" title="Thumbs up">&#x25B2;</button>
          <button class="rate-btn" data-rating="neutral" data-comp="${component}" title="Neutral">&#x25CF;</button>
          <button class="rate-btn" data-rating="down" data-comp="${component}" title="Thumbs down">&#x25BC;</button>
        </span>
      `;

      const genState = _genRatings[genIndex];
      const existing = genState && genState[component];
      if (existing) {
        const activeBtn = row.querySelector(`.rate-btn[data-rating="${existing}"]`);
        if (activeBtn) activeBtn.classList.add('active-' + existing);
      }

      const buttons = row.querySelectorAll('.rate-btn');
      for (const btn of buttons) {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!_currentJobId) return;
          const rating = btn.dataset.rating;
          const prev = (_genRatings[genIndex] || {})[component];
          if (prev === rating) return;
          try {
            const res = await fetch('/api/rate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jobId: _currentJobId, genIndex, component, rating }),
            });
            if (res.status === 404) {
              expireAllStrips();
              return;
            }
            if (!res.ok) return;
            if (!_genRatings[genIndex]) _genRatings[genIndex] = {};
            _genRatings[genIndex][component] = rating;
            for (const b of buttons) {
              b.classList.remove('active-up', 'active-down', 'active-neutral');
            }
            btn.classList.add('active-' + rating);
          } catch (err) {
            console.error('Rating error:', err.message);
          }
        });
      }

      return row;
    }

    function createRatingStrip(genIndex, componentInfo) {
      const strip = document.createElement('div');
      strip.className = 'gen-rating-strip';
      strip.dataset.genIndex = genIndex;

      const header = document.createElement('div');
      header.className = 'strip-header';
      header.textContent = `Gen ${genIndex + 1}`;
      strip.appendChild(header);

      strip.appendChild(buildCompRow(genIndex, 'styles', 'Style', componentInfo.style));
      strip.appendChild(buildCompRow(genIndex, 'interpretations', 'Interp', componentInfo.interpretation));
      strip.appendChild(buildCompRow(genIndex, 'srefs', 'Sref', componentInfo.srefName));

      strip.addEventListener('mouseenter', () => {
        if (!_galleryContainer) return;
        for (const card of _galleryContainer.children) {
          if (String(card.dataset.genIndex) === String(genIndex)) {
            card.classList.add('gen-highlighted');
            card.classList.remove('gen-dimmed');
          } else {
            card.classList.add('gen-dimmed');
            card.classList.remove('gen-highlighted');
          }
        }
      });
      strip.addEventListener('mouseleave', () => {
        if (!_galleryContainer) return;
        for (const card of _galleryContainer.children) {
          card.classList.remove('gen-dimmed', 'gen-highlighted');
        }
      });

      _ratingStrips.push(strip);
      return strip;
    }

    function renderGalleryWithRatings(container, images, serverRatings) {
      container.innerHTML = '';
      ratingSidebar.innerHTML = '';
      _ratingStrips = [];

      if (serverRatings && Object.keys(serverRatings).length > 0) {
        _genRatings = {};
        for (const [k, v] of Object.entries(serverRatings)) {
          _genRatings[k] = typeof v === 'object' && v !== null ? { ...v } : {};
        }
      }

      const genGroups = {};
      for (const img of images) {
        const gi = img.genIndex != null ? img.genIndex : 0;
        if (!genGroups[gi]) genGroups[gi] = [];
        genGroups[gi].push(img);
      }

      let globalIndex = 0;
      const genIndices = Object.keys(genGroups).map(Number).sort((a, b) => a - b);

      for (const gi of genIndices) {
        const group = genGroups[gi];
        const first = group[0] || {};
        const info = { style: first.style || '', interpretation: first.interpretation || '', srefName: first.srefName || '' };
        ratingSidebar.appendChild(createRatingStrip(gi, info));

        for (const img of group) {
          container.appendChild(renderGalleryCard(img, globalIndex));
          globalIndex++;
        }
      }

      ratingSidebar.classList.remove('hidden');
      initGalleryParallax(container);
    }

    let _galleryContainer = null;
    function initGalleryParallax(container) {
      _galleryContainer = container;

      for (const card of container.children) {
        card.addEventListener('mouseenter', () => {
          const hoveredDepth = parseFloat(card.dataset.depth) || 0.5;
          for (const other of container.children) {
            if (other === card) {
              other.style.filter = 'blur(0px)';
              continue;
            }
            const otherDepth = parseFloat(other.dataset.depth) || 0.5;
            const dist = Math.abs(hoveredDepth - otherDepth);
            const blur = (dist * 5).toFixed(1);
            other.style.filter = `blur(${blur}px)`;
          }
        });
        card.addEventListener('mouseleave', () => {
          for (const other of container.children) {
            other.style.filter = 'blur(0px)';
          }
        });
      }
    }
    document.addEventListener('mousemove', (e) => {
      if (!_galleryContainer || !_galleryContainer.children.length) return;
      if (gallerySection.classList.contains('hidden')) return;
      const mx = (e.clientX / window.innerWidth - 0.5) * 2;
      const my = (e.clientY / window.innerHeight - 0.5) * 2;
      for (const card of _galleryContainer.children) {
        const depth = parseFloat(card.dataset.depth) || 0.5;
        const baseRot = parseFloat(card.dataset.baseRotation) || 0;
        const tx = mx * depth * 50;
        const ty = my * depth * 35;
        card.style.transform = `translate(${tx}px, ${ty}px) rotate(${baseRot}deg)`;
      }
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxConcept = document.getElementById('lightbox-concept');
    const lightboxPrompt = document.getElementById('lightbox-prompt');
    const lightboxDl = document.getElementById('lightbox-dl');

    function openLightbox(img) {
      const url = safeUrl(img.url);
      lightboxImg.src = url;
      lightboxConcept.textContent = img.concept || '';
      lightboxPrompt.textContent = img.prompt || '';
      lightboxDl.href = url;
      lightbox.classList.remove('hidden');
    }

    function closeLightbox() { lightbox.classList.add('hidden'); }

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !lightbox.classList.contains('hidden')) closeLightbox();
    });

    async function startGeneration() {
      if (generateBtn.disabled) return;
      const fundName = fundNameInput.value.trim();
      const fundThesis = fundThesisInput.value.trim();
      if (!fundName) { fundNameInput.focus(); return; }

      resetUI();
      pipelineSection.classList.remove('hidden');
      generateBtn.disabled = true;
      generateBtn.textContent = 'Running...';
      generateBtn.classList.add('running');

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fundName, fundThesis, useStyleBank: styleBankEnabled, manualStyle: selectedStyle, manualInterpretation: selectedInterp }),
        });
        if (res.status === 401) { location.reload(); return; }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Server error ${res.status}`);
        await pollJob(data.jobId);
      } catch (err) {
        errorDisplay.classList.remove('hidden');
        errorText.textContent = err.message;
        updateStages('error');
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate';
        generateBtn.classList.remove('running');
      }
    }

    const MAX_POLL_ITERATIONS = 300;

    async function pollJob(jobId) {
      _currentJobId = jobId;
      for (let iter = 0; iter < MAX_POLL_ITERATIONS; iter++) {
        await new Promise((r) => setTimeout(r, 2000));

        let status;
        try {
          const statusRes = await fetch(`/api/status/${jobId}`);
          if (statusRes.status === 401) { location.reload(); return; }
          if (!statusRes.ok) throw new Error(`Server returned ${statusRes.status}`);
          status = await statusRes.json();
        } catch (err) {
          console.warn('Poll fetch failed, retrying...', err.message);
          continue;
        }

        updateStages(status.stage);

        if (status.concepts?.length > 0 && conceptsPreview.classList.contains('hidden')) {
          conceptsPreview.classList.remove('hidden');
          conceptsList.innerHTML = status.concepts.map((c, i) => {
            const style = c.style || status.assignedStyles?.[i] || '';
            const interp = c.interpretation || status.assignedInterpretations?.[i] || '';
            return `<div class="concept-row">
              <span class="concept-num">${String(i+1).padStart(2,'0')}</span>
              <span class="concept-label">${esc(c.concept)}</span>
              ${style ? `<span class="concept-style">${esc(style)}</span>` : ''}
              ${interp ? `<span class="concept-interp">${esc(interp)}</span>` : ''}
              <span class="concept-prompt">${esc(c.prompt)}</span>
            </div>`;
          }).join('');
        }

        if (status.stage === 'error') {
          errorDisplay.classList.remove('hidden');
          errorText.textContent = status.error || 'An unknown error occurred';
          return;
        }

        if ((status.stage === 'images_ready' || status.stage === 'qc_check') && gallerySection.classList.contains('hidden')) {
          if (status.rawImages?.length > 0) {
            gallerySection.classList.remove('hidden');
            renderGalleryWithRatings(galleryScatter, status.rawImages.map((img) => ({ ...img, verdict: null })), status.genRatings);
          }
        }

        if (status.stage === 'complete') {
          let results;
          try {
            const resultsRes = await fetch(`/api/results/${jobId}`);
            if (resultsRes.status === 401) { location.reload(); return; }
            if (!resultsRes.ok) throw new Error(`Server returned ${resultsRes.status}`);
            results = await resultsRes.json();
          } catch (err) {
            errorDisplay.classList.remove('hidden');
            errorText.textContent = `Failed to fetch results: ${err.message}`;
            return;
          }

          const allImages = [
            ...(results.approvedImages || []),
            ...(results.rejectedImages || []),
          ];

          if (allImages.length > 0) {
            gallerySection.classList.remove('hidden');
            renderGalleryWithRatings(galleryScatter, allImages, results.genRatings);
          }

          if (!results.approvedImages?.length && results.rejectedImages?.length) {
            errorDisplay.classList.remove('hidden');
            errorText.textContent = 'All images were rejected by QC. Try again.';
          }
          return;
        }
      }

      errorDisplay.classList.remove('hidden');
      errorText.textContent = 'Polling timed out — job may still be running on the server.';
      updateStages('error');
    }

    // History modal
    async function openHistory() {
      historyModal.classList.remove('hidden');
      historyContent.innerHTML = '<div class="history-empty">Loading...</div>';
      try {
        const res = await fetch('/api/history');
        if (res.status === 401) { location.reload(); return; }
        if (!res.ok) throw new Error(`Server returned ${res.status}`);
        const history = await res.json();
        if (history.length === 0) {
          historyContent.innerHTML = '<div class="history-empty">No images generated yet.</div>';
          return;
        }
        historyContent.innerHTML = `<div class="history-grid">${history.map((h) => `
          <div class="history-card">
            <img src="${safeUrl('/api/archive/' + h.filename)}" alt="" loading="lazy" />
            <div class="history-card-info">
              <div class="history-card-fund">${esc(h.fundName)}</div>
              ${h.concept ? `<div class="history-card-concept">${esc(h.concept)}</div>` : ''}
              <div class="history-card-date">${new Date(h.archivedAt).toLocaleDateString()}</div>
              <a class="download-btn" href="${safeUrl('/api/archive/' + h.filename)}" download>&#8595; Download</a>
            </div>
          </div>
        `).join('')}</div>`;
      } catch {
        historyContent.innerHTML = '<div class="history-empty">Failed to load history.</div>';
      }
    }

    function closeModal() { historyModal.classList.add('hidden'); }

    historyBtn.addEventListener('click', openHistory);
    modalClose.addEventListener('click', closeModal);
    historyModal.addEventListener('click', (e) => { if (e.target === historyModal) closeModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !historyModal.classList.contains('hidden')) closeModal();
    });
    generateBtn.addEventListener('click', startGeneration);
    fundNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') startGeneration(); });
    fundThesisInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); startGeneration(); } });
  </script>
</body>
